[project]
name = "youtube-extractor"
version = "0.1.0"
description = "Turn a YouTube link into a distilled Obsidian .md plus FULL and LAZY PDFs."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "psyd3x"}]
keywords = ["youtube", "transcript", "obsidian", "pdf", "llm", "summarisation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  # YouTube has required PO tokens since 2026-08: the stable yt-dlp 403s on every
  # audio download (metadata still resolves, which is why this looked like a
  # transcript problem) and surfaced here as "whisper fallback failed: HTTP Error
  # 403: Forbidden" for any video without an official transcript. Needs yt-dlp
  # NIGHTLY plus the bgutil plugin, which fetches tokens from the provider server
  # (docker "bgutil-provider" on :4416, already running for vid2data). The .dev
  # floor is what stops a plain `uv sync` resolving back to stable and re-breaking it.
  "yt-dlp>=2026.8.4.234419.dev0",
  "bgutil-ytdlp-pot-provider>=1.3.1",
  "youtube-transcript-api>=0.6.2",
  "jinja2>=3.1",
  "weasyprint>=63.0",
  "click>=8.1",
  "python-slugify>=8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
  "respx>=0.21",
  "ruff>=0.7",
]
whisper = ["mlx-whisper>=0.4"]

[project.urls]
Homepage = "https://github.com/psyd3x/youtube-extractor"
Repository = "https://github.com/psyd3x/youtube-extractor"
Issues = "https://github.com/psyd3x/youtube-extractor/issues"

[project.scripts]
youtube-extractor = "youtube_extractor.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_extractor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
